<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8B3A34" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="輕盈日誌" />
  <title>輕盈日誌 — 個人減重與運動管理</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            muji: {
              bg: '#F7F4EF',
              card: '#FCFBF8',
              soft: '#EFECE6',
              border: '#E5DFD3',
              brown: '#6E5B4B',
              brownLight: '#8C7A6B',
              text: '#383028',
              muted: '#7A6F64',
              red: '#8B3A34',
              redHover: '#732E29'
            }
          },
          fontFamily: {
            sans: ['"PingFang TC"', '"Noto Sans TC"', '"Microsoft JhengHei"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.10/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app-shell {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #app-main {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
    }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    input[type="date"] {
      min-width: 0;
      max-width: 100%;
    }
  </style>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
</head>
<body class="bg-muji-bg text-muji-text dark:bg-stone-950 dark:text-stone-100 antialiased">
  <div id="app-shell">
    <header class="shrink-0 z-30 border-b border-muji-border bg-muji-card/95 px-4 py-3 backdrop-blur-md dark:border-stone-800 dark:bg-stone-900/95">
      <div class="mx-auto flex max-w-3xl items-center justify-between">
        <h1 class="text-lg font-bold tracking-wide text-muji-red dark:text-red-300">輕盈日誌</h1>
        <button type="button" id="header-backup-btn" class="rounded-lg border border-muji-border bg-muji-soft px-3 py-1 text-xs font-semibold text-muji-brown hover:bg-muji-border/50 dark:border-stone-700 dark:bg-stone-800 dark:text-stone-200">備份</button>
      </div>
    </header>

    <main id="app-main" class="w-full px-4 py-4">
      <div id="app-content" class="mx-auto max-w-3xl">
        <div class="py-12 text-center text-sm text-muji-muted">載入本機資料庫中…</div>
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-muji-border bg-muji-card/95 backdrop-blur-md dark:border-stone-800 dark:bg-stone-900/95 safe-bottom">
      <div id="bottom-nav" class="mx-auto flex max-w-3xl items-center justify-around px-1 py-1.5"></div>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="pointer-events-none fixed bottom-20 left-1/2 z-50 -translate-x-1/2"></div>

  <script>
    // ========= 1. 臺灣時間 (Asia/Taipei) 工具 =========
    const TAIPEI_TZ = 'Asia/Taipei';
    const WEEKDAY_NAMES = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const WEEKDAY_SHORT = ['日', '一', '二', '三', '四', '五', '六'];

    function formatTaipeiDate(date) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TAIPEI_TZ, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(date);
      const get = (t) => parts.find(p => p.type === t)?.value || '01';
      return `${get('year')}-${get('month')}-${get('day')}`;
    }
    function getTaipeiToday() { return formatTaipeiDate(new Date()); }
    function formatTaipeiFilenameTs() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TAIPEI_TZ, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(new Date());
      const get = (t) => parts.find(p => p.type === t)?.value || '00';
      return `${get('year')}-${get('month')}-${get('day')}-${get('hour')}${get('minute')}`;
    }
    function parseDateStr(s) { return new Date(`${s}T12:00:00+08:00`); }
    function addDays(s, delta) {
      const dt = parseDateStr(s);
      dt.setUTCDate(dt.getUTCDate() + delta);
      return formatTaipeiDate(dt);
    }
    function diffDays(a, b) {
      return Math.round((parseDateStr(b).getTime() - parseDateStr(a).getTime()) / 86400000);
    }
    function getWeekday(s) {
      const name = new Intl.DateTimeFormat('en-US', { timeZone: TAIPEI_TZ, weekday: 'short' }).format(parseDateStr(s));
      return ({ Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 })[name] ?? 0;
    }
    function getWeekdayLabel(s) { return WEEKDAY_NAMES[getWeekday(s)]; }
    function getWeekDates(anchor) {
      const wd = getWeekday(anchor);
      const mon = addDays(anchor, wd === 0 ? -6 : 1 - wd);
      return Array.from({ length: 7 }, (_, i) => addDays(mon, i));
    }
    function round2(n) { return Math.round(n * 100) / 100; }
    function escHtml(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function renderDatePicker(id, value, max = '', extraClass = '') {
      const display = value ? value.replace(/-/g, '/') : '年 / 月 / 日';
      return `
        <div class="relative flex items-center justify-between overflow-hidden rounded-xl border border-muji-border bg-muji-soft px-3 py-2 text-sm dark:border-stone-700 dark:bg-stone-800 ${extraClass}">
          <span id="${id}-display" class="truncate font-medium ${value ? '' : 'text-muji-muted'}">${display}</span>
          <span class="ml-2 shrink-0 text-xs text-muji-muted">▾</span>
          <input type="date" id="${id}" value="${escHtml(value || '')}" ${max ? `max="${max}"` : ''} class="absolute inset-0 h-full w-full cursor-pointer opacity-0" />
        </div>`;
    }
    function bindDateDisplaySync(id, onChangeCb) {
      const inp = document.getElementById(id);
      const disp = document.getElementById(id + '-display');
      if (!inp) return;
      inp.addEventListener('change', (e) => {
        const v = e.target.value;
        if (disp) {
          disp.textContent = v ? v.replace(/-/g, '/') : '年 / 月 / 日';
          disp.classList.toggle('text-muji-muted', !v);
        }
        if (onChangeCb) onChangeCb(v);
      });
    }

    // ========= 2. Dexie.js IndexedDB 資料庫 =========
    const db = new Dexie('LightLogWeightTrackerDB');
    db.version(1).stores({
      settings: 'id',
      weightLogs: 'id, &date',
      mealLogs: 'id, &date',
      exercisePlans: 'id, active',
      exerciseOverrides: 'id, &date',
      exerciseLogs: 'id, date, planId'
    });

    const DEFAULT_SETTINGS = {
      id: 'main',
      initialWeight: null,
      targetWeight: null,
      targetDate: null,
      dailyCalorieTarget: 1800,
      bmrCalories: null,
      darkMode: false,
      lastBackupConfirmedAt: null,
      lastBackupGeneratedAt: null,
      backupReminderDays: 7,
      updatedAt: new Date().toISOString()
    };

    const DEFAULT_PLANS = [
      { id: 'plan_stepper', name: '健身房踏步機', category: 'cardio', met: 7.0, defaultMinutes: 30, scheduleType: 'daily', weekdays: [0,1,2,3,4,5,6], weeklyFrequency: 7, active: true, createdAt: '2026-01-01T00:00:00.000Z', updatedAt: '2026-01-01T00:00:00.000Z' },
      { id: 'plan_weights', name: '重量訓練', category: 'strength', met: 5.0, defaultMinutes: 60, scheduleType: 'weekly_days', weekdays: [2,5], weeklyFrequency: 2, active: true, createdAt: '2026-01-01T00:00:00.000Z', updatedAt: '2026-01-01T00:00:00.000Z' },
      { id: 'plan_badminton', name: '羽球', category: 'sport', met: 5.5, defaultMinutes: 60, scheduleType: 'weekly_days', weekdays: [3,6], weeklyFrequency: 2, active: true, createdAt: '2026-01-01T00:00:00.000Z', updatedAt: '2026-01-01T00:00:00.000Z' }
    ];

    // ========= 3. 應用程式狀態 =========
    const state = {
      tab: 'dashboard',
      selectedDate: getTaipeiToday(),
      weightFormDate: getTaipeiToday(),
      weightRange: '15',
      exerciseRange: '15',
      dietRange: '15',
      expandedExKey: null,
      settings: { ...DEFAULT_SETTINGS },
      weightLogs: [],
      mealLogs: [],
      exercisePlans: [],
      exerciseOverrides: [],
      exerciseLogs: [],
      charts: {},
      checkin: { size: 'square', showWeight: true, showFood: true, blob: null, dataUrl: null }
    };

    function showToast(msg) {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = 'rounded-full bg-muji-brown px-4 py-2 text-xs font-medium text-white shadow-lg dark:bg-stone-100 dark:text-stone-900';
      el.textContent = msg;
      root.innerHTML = '';
      root.appendChild(el);
      setTimeout(() => { if (root.contains(el)) root.innerHTML = ''; }, 3000);
    }

    async function loadAllData() {
      const [s, w, m, p, o, e] = await Promise.all([
        db.settings.get('main'),
        db.weightLogs.toArray(),
        db.mealLogs.toArray(),
        db.exercisePlans.toArray(),
        db.exerciseOverrides.toArray(),
        db.exerciseLogs.toArray()
      ]);
      if (s) state.settings = s;
      state.weightLogs = w;
      state.mealLogs = m;
      state.exercisePlans = p;
      state.exerciseOverrides = o;
      state.exerciseLogs = e;
      document.documentElement.classList.toggle('dark', !!state.settings.darkMode);
    }

    // ========= 4. 計算引擎 =========
    function computeWeightStats() {
      const today = getTaipeiToday();
      const sorted = [...state.weightLogs].sort((a, b) => a.date.localeCompare(b.date));
      const latest = sorted[sorted.length - 1] || null;
      const prev = sorted[sorted.length - 2] || null;
      const latestWeight = latest ? latest.weight : null;
      const deltaFromPrevious = latest && prev ? round2(latest.weight - prev.weight) : null;
      const remainingToTarget = latestWeight !== null && state.settings.targetWeight !== null ? round2(latestWeight - state.settings.targetWeight) : null;
      const baseline = state.settings.initialWeight ?? (sorted[0]?.weight ?? null);
      const totalLostKg = latestWeight !== null && baseline !== null ? round2(baseline - latestWeight) : null;
      const totalLostPct = totalLostKg !== null && baseline > 0 ? round2((totalLostKg / baseline) * 100) : null;
      const daysRemaining = state.settings.targetDate ? diffDays(today, state.settings.targetDate) : null;

      const d7 = addDays(today, -6);
      const r7 = sorted.filter(l => l.date >= d7 && l.date <= today);
      const avg7Days = r7.length ? round2(r7.reduce((s, l) => s + l.weight, 0) / r7.length) : null;

      const d30 = addDays(today, -30);
      const r30 = sorted.filter(l => l.date >= d30 && l.date <= today);
      const change30Days = r30.length >= 2 ? round2(r30[r30.length - 1].weight - r30[0].weight) : null;

      let weeklyAvgChange = null;
      if (sorted.length >= 2) {
        const span = diffDays(sorted[0].date, sorted[sorted.length - 1].date);
        if (span >= 1) weeklyAvgChange = round2(((sorted[sorted.length - 1].weight - sorted[0].weight) / span) * 7);
      }
      return { latestWeight, deltaFromPrevious, remainingToTarget, totalLostKg, totalLostPct, daysRemaining, avg7Days, change30Days, weeklyAvgChange, sorted };
    }

    function getScheduledPlansForDate(dateStr) {
      const ov = state.exerciseOverrides.find(o => o.date === dateStr);
      if (ov?.isRestDay) return [];
      const active = state.exercisePlans.filter(p => p.active);
      if (ov && Array.isArray(ov.customPlanIds)) {
        const set = new Set(ov.customPlanIds);
        return active.filter(p => set.has(p.id));
      }
      const wd = getWeekday(dateStr);
      return active.filter(p => p.scheduleType === 'daily' || (p.scheduleType === 'weekly_days' && p.weekdays.includes(wd)));
    }

    function getCombinedExercises(dateStr) {
      const scheduled = getScheduledPlansForDate(dateStr);
      const dayLogs = state.exerciseLogs.filter(l => l.date === dateStr);
      const list = scheduled.map(plan => {
        const log = dayLogs.find(l => l.planId === plan.id);
        return {
          key: plan.id, plan, log,
          name: log?.name ?? plan.name,
          minutes: log?.actualMinutes ?? log?.plannedMinutes ?? plan.defaultMinutes,
          completed: log?.completed ?? false,
          calories: log?.caloriesBurned ?? null,
          isEstimated: log?.caloriesIsEstimated ?? false
        };
      });
      dayLogs.filter(l => l.isAdHoc || !scheduled.some(p => p.id === l.planId)).forEach(log => {
        list.push({
          key: log.id, plan: null, log, name: log.name,
          minutes: log.actualMinutes ?? log.plannedMinutes,
          completed: log.completed, calories: log.caloriesBurned, isEstimated: log.caloriesIsEstimated
        });
      });
      return list;
    }

    function getRestingEnergy(dateStr) {
      const ov = state.exerciseOverrides.find(o => o.date === dateStr);
      return ov?.restingCalories ?? null;
    }

    function computeDailyCalorieSummary(dateStr) {
      const mealLog = state.mealLogs.find(m => m.date === dateStr);
      const exLogs = state.exerciseLogs.filter(l => l.date === dateStr && l.completed);
      const target = mealLog?.targetCaloriesSnapshot ?? state.settings.dailyCalorieTarget;
      const exerciseBurned = exLogs.reduce((s, l) => s + (l.caloriesBurned ?? 0), 0);
      const restingEnergy = getRestingEnergy(dateStr);
      const bmr = state.settings.bmrCalories ?? null;
      if (!mealLog) {
        return {
          totalIntake: null, targetCalories: target, remainingQuota: null,
          exerciseBurned, restingEnergy, netAfterAll: null, intakeMinusBmr: null, totalProtein: null
        };
      }
      const vals = [mealLog.breakfast.calories, mealLog.lunch.calories, mealLog.dinner.calories, mealLog.other.calories]
        .filter(v => v !== null && !Number.isNaN(v));
      const pVals = [mealLog.breakfast.protein, mealLog.lunch.protein, mealLog.dinner.protein, mealLog.other.protein]
        .filter(v => v !== null && v !== undefined && !Number.isNaN(v));
      const totalProtein = pVals.length ? round2(pVals.reduce((a, b) => a + b, 0)) : null;
      if (!vals.length) {
        return {
          totalIntake: null, targetCalories: target, remainingQuota: null,
          exerciseBurned, restingEnergy, netAfterAll: null, intakeMinusBmr: null, totalProtein
        };
      }
      const totalIntake = vals.reduce((a, b) => a + b, 0);
      const netAfterAll = totalIntake - exerciseBurned - (restingEnergy ?? 0);
      const intakeMinusBmr = bmr !== null ? totalIntake - bmr : null;
      return {
        totalIntake, targetCalories: target, remainingQuota: target - totalIntake,
        exerciseBurned, restingEnergy, netAfterAll, intakeMinusBmr, totalProtein
      };
    }

    function estimateMetCalories(met, weightKg, mins) {
      const w = weightKg && weightKg > 0 ? weightKg : 65;
      return Math.round(met * w * (mins / 60));
    }

    // ========= 5. 資料庫寫入操作 =========
    async function saveWeight(date, weight, note = '') {
      try {
        const now = new Date().toISOString();
        const existing = await db.weightLogs.get(`w_${date}`);
        await db.transaction('rw', db.weightLogs, async () => {
          await db.weightLogs.put({ id: `w_${date}`, date, weight, note, createdAt: existing?.createdAt ?? now, updatedAt: now });
        });
        await loadAllData();
        document.getElementById('header-backup-btn')?.addEventListener('click', async () => {
          const payload = {
            app: 'light-log-weight-tracker', schemaVersion: 1, backupVersion: '1.0.0', exportedAt: new Date().toISOString(),
            data: { settings: await db.settings.toArray(), weightLogs: await db.weightLogs.toArray(), mealLogs: await db.mealLogs.toArray(), exercisePlans: await db.exercisePlans.toArray(), exerciseOverrides: await db.exerciseOverrides.toArray(), exerciseLogs: await db.exerciseLogs.toArray() }
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          await shareOrDownload(blob, `weight-backup-${formatTaipeiFilenameTs()}.json`, '輕盈日誌備份');
          await db.settings.put({ ...state.settings, lastBackupGeneratedAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
          await loadAllData();
          showToast('已產生備份檔');
        });
        render();
        showToast('體重已儲存');
      } catch (err) {
        showToast('寫入失敗：' + (err.message || '儲存空間不足'));
      }
    }

    async function saveMealField(date, mealKey, field, rawVal) {
      try {
        const existing = await db.mealLogs.get(`m_${date}`);
        const base = existing || {
          id: `m_${date}`, date, targetCaloriesSnapshot: state.settings.dailyCalorieTarget,
          breakfast: { food: '', calories: null }, lunch: { food: '', calories: null },
          dinner: { food: '', calories: null }, other: { food: '', calories: null }, updatedAt: new Date().toISOString()
        };
        const nextEntry = { ...base[mealKey] };
        if (field === 'food') nextEntry.food = rawVal;
        else if (field === 'protein') nextEntry.protein = rawVal.trim() === '' ? null : Math.max(0, Math.round(Number(rawVal) * 10) / 10);
        else nextEntry.calories = rawVal.trim() === '' ? null : Math.max(0, Math.round(Number(rawVal)));
        base[mealKey] = nextEntry;
        base.updatedAt = new Date().toISOString();
        await db.transaction('rw', db.mealLogs, async () => { await db.mealLogs.put(base); });
        await loadAllData();
        render();
        showToast('飲食紀錄已儲存');
      } catch (err) {
        showToast('寫入失敗：' + err.message);
      }
    }

    async function toggleExerciseItem(date, key, updates) {
      try {
        const items = getCombinedExercises(date);
        const target = items.find(i => i.key === key);
        if (!target) return;
        const now = new Date().toISOString();
        const id = target.log?.id ?? `ex_${date}_${target.plan.id}`;
        const record = {
          id, date,
          planId: target.log?.planId ?? target.plan?.id ?? null,
          name: target.log?.name ?? target.plan?.name ?? '運動',
          met: target.log?.met ?? target.plan?.met ?? 5.0,
          plannedMinutes: target.log?.plannedMinutes ?? target.plan?.defaultMinutes ?? 30,
          actualMinutes: target.log?.actualMinutes ?? target.plan?.defaultMinutes ?? 30,
          completed: target.log?.completed ?? false,
          caloriesBurned: target.log?.caloriesBurned ?? null,
          caloriesIsEstimated: target.log?.caloriesIsEstimated ?? false,
          note: target.log?.note ?? '',
          isAdHoc: target.log?.isAdHoc ?? !target.plan,
          createdAt: target.log?.createdAt ?? now,
          updatedAt: now,
          ...updates
        };
        await db.transaction('rw', db.exerciseLogs, async () => { await db.exerciseLogs.put(record); });
        await loadAllData();
        render();
        showToast('運動紀錄已儲存');
      } catch (err) {
        showToast('寫入失敗：' + err.message);
      }
    }

    // ========= 6. 頁面渲染 =========
    function destroyCharts() {
      Object.values(state.charts).forEach(c => c?.destroy());
      state.charts = {};
    }

    function getTimelineDates(allRecordDates, minDays = 30) {
      const today = getTaipeiToday();
      let start = addDays(today, -(minDays - 1));
      for (const d of allRecordDates) {
        if (d && d < start) start = d;
      }
      const dates = [];
      let cur = start;
      let guard = 0;
      while (cur <= today && guard < 1500) {
        dates.push(cur);
        cur = addDays(cur, 1);
        guard++;
      }
      return dates;
    }

    function renderRangePills(attrName, activeVal) {
      const opts = [['7', '一週'], ['15', '半月'], ['30', '一個月'], ['all', '全部']];
      return `
        <div class="flex rounded-xl bg-muji-soft p-1 text-xs dark:bg-stone-800">
          ${opts.map(([v, lbl]) => `
            <button type="button" ${attrName}="${v}" class="rounded-lg px-2.5 py-1 font-medium ${activeVal === v ? 'bg-white text-muji-red shadow-sm dark:bg-stone-700 dark:text-red-300' : 'text-muji-muted'}">${lbl}</button>
          `).join('')}
        </div>`;
    }

    function computeOptimalYBounds(values, clampZero = false, minPad = 1) {
      const nums = values.filter(v => v !== null && v !== undefined && !Number.isNaN(v));
      if (nums.length === 0) return { min: 0, max: 100 };
      let mn = Math.min(...nums);
      let mx = Math.max(...nums);
      const span = mx - mn;
      const pad = span > 0 ? Math.max(minPad * 0.5, span * 0.18) : minPad;
      let yMin = mn - pad;
      let yMax = mx + pad;
      if (clampZero && yMin < 0) yMin = 0;
      return {
        min: Number(yMin.toFixed(1)),
        max: Number(yMax.toFixed(1))
      };
    }

    function mountStockChart(yAxisCanvasId, scrollId, canvasId, chartKey, dates, rangeVal, yBounds, chartConfig) {
      const yCanvas = document.getElementById(yAxisCanvasId);
      const scroller = document.getElementById(scrollId);
      const inner = scroller?.firstElementChild;
      const canvas = document.getElementById(canvasId);
      if (!scroller || !inner || !canvas || !yCanvas) return;

      if (rangeVal === 'all') {
        inner.style.width = '100%';
      } else {
        const winDays = Number(rangeVal);
        const pct = Math.max(100, (dates.length / winDays) * 100);
        inner.style.width = pct + '%';
      }

      // 固定左側 Y 軸畫布
      state.charts[chartKey + '_y'] = new Chart(yCanvas, {
        type: 'line',
        data: { labels: [''], datasets: [{ data: [] }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          layout: { padding: { top: 8, bottom: 26, left: 2, right: 0 } },
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { display: false },
            y: {
              min: yBounds.min,
              max: yBounds.max,
              afterFit: (scale) => { scale.width = 58; },
              grid: { display: false },
              ticks: { font: { size: 11 }, color: '#7A6F64', padding: 6 }
            }
          }
        }
      });

        const payload = {
          app: 'light-log-weight-tracker', schemaVersion: 1, backupVersion: '1.0.0', exportedAt: new Date().toISOString(),
          data: { settings: await db.settings.toArray(), weightLogs: await db.weightLogs.toArray(), mealLogs: await db.mealLogs.toArray(), exercisePlans: await db.exercisePlans.toArray(), exerciseOverrides: await db.exerciseOverrides.toArray(), exerciseLogs: await db.exerciseLogs.toArray() }
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        await shareOrDownload(blob, `weight-backup-${formatTaipeiFilenameTs()}.json`, '輕盈日誌備份');
        await db.settings.put({ ...state.settings, lastBackupGeneratedAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
        await loadAllData(); render(); showToast('已產生備份檔，請確認儲存後點擊確認按鈕');
      });
      document.getElementById('btn-confirm-backup')?.addEventListener('click', async () => {
        await db.settings.put({ ...state.settings, lastBackupConfirmedAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
        await loadAllData(); render(); showToast('已更新上次確認備份日期');
      });
      document.getElementById('btn-restore-json').addEventListener('click', () => document.getElementById('inp-restore-json').click());
      document.getElementById('inp-restore-json').addEventListener('change', async (e) => {
        const file = e.target.files?.[0]; e.target.value = '';
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          if (parsed?.app !== 'light-log-weight-tracker' || parsed?.schemaVersion !== 1 || !parsed?.data) {
            return showToast('備份格式或版本不相容，已取消匯入');
          }
          openRestoreConfirmModal(parsed);
        } catch { showToast('JSON 解析失敗，原有資料安全保留'); }
      });
      document.getElementById('btn-csv-daily').addEventListener('click', () => {
        const dates = Array.from(new Set([...state.weightLogs.map(w=>w.date), ...state.mealLogs.map(m=>m.date), ...state.exerciseLogs.map(e=>e.date)])).sort();
        const header = '日期,體重(kg),早餐熱量(kcal),午餐熱量(kcal),晚餐熱量(kcal),其他熱量(kcal),當日總攝取(kcal),當日攝取目標(kcal),運動項目,運動時間(分鐘),運動消耗熱量(kcal)';
        const rows = dates.map(dt => {
          const w = state.weightLogs.find(x=>x.date===dt);
          const m = state.mealLogs.find(x=>x.date===dt);
          const ex = state.exerciseLogs.filter(x=>x.date===dt && x.completed);
          const cal = computeDailyCalorieSummary(dt);
          return [dt, w ? w.weight.toFixed(2) : '', m?.breakfast.calories ?? '未記錄', m?.lunch.calories ?? '未記錄', m?.dinner.calories ?? '未記錄', m?.other.calories ?? '未記錄', cal.totalIntake ?? '未記錄', cal.targetCalories, ex.map(x=>x.name).join(' / '), ex.length ? ex.reduce((s,x)=>s+(x.actualMinutes??x.plannedMinutes),0) : '', ex.length ? ex.reduce((s,x)=>s+(x.caloriesBurned??0),0) : ''].join(',');
        });
        downloadBlob(new Blob(['\uFEFF' + [header, ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' }), `daily-summary-${today}.csv`);
        showToast('已匯出每日統計 CSV');
      });
      document.getElementById('btn-csv-ex').addEventListener('click', () => {
        const header = '日期,運動項目,是否完成,預定時間(分鐘),實際時間(分鐘),消耗熱量(kcal)';
        const rows = state.exerciseLogs.map(e => [e.date, e.name, e.completed ? '已完成' : '未完成', e.plannedMinutes, e.actualMinutes ?? '', e.caloriesBurned ?? ''].join(','));
        downloadBlob(new Blob(['\uFEFF' + [header, ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' }), `exercise-details-${today}.csv`);
        showToast('已匯出運動明細 CSV');
      });
    }

    async function shareOrDownload(blob, filename, title) {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ title, files: [file] });
          return 'shared';
        } catch (err) {
          if (err && err.name === 'AbortError') return 'aborted';
        }
      }
      downloadBlob(blob, filename);
      return 'downloaded';
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function openRestoreConfirmModal(payload) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/60 p-4">
          <div class="w-full max-w-sm rounded-2xl bg-muji-card p-5 shadow-xl dark:bg-stone-900">
            <h4 class="font-bold text-muji-red">確認覆蓋還原資料？</h4>
            <p class="mt-2 text-xs text-muji-muted">備份包含體重 ${payload.data.weightLogs?.length || 0} 筆、飲食 ${payload.data.mealLogs?.length || 0} 筆、運動 ${payload.data.exerciseLogs?.length || 0} 筆。覆蓋後無法復原！</p>
            <div class="mt-4 flex justify-end gap-2">
              <button type="button" id="m-cancel" class="rounded-xl px-4 py-2 text-xs">取消</button>
              <button type="button" id="m-confirm" class="rounded-xl bg-muji-red px-4 py-2 text-xs font-bold text-white">確認覆蓋還原</button>
            </div>
          </div>
        </div>`;
      document.getElementById('m-cancel').addEventListener('click', () => { root.innerHTML = ''; });
      document.getElementById('m-confirm').addEventListener('click', async () => {
        await db.transaction('rw', [db.settings, db.weightLogs, db.mealLogs, db.exercisePlans, db.exerciseOverrides, db.exerciseLogs], async () => {
          await Promise.all([db.settings.clear(), db.weightLogs.clear(), db.mealLogs.clear(), db.exercisePlans.clear(), db.exerciseOverrides.clear(), db.exerciseLogs.clear()]);
          if (payload.data.settings?.length) await db.settings.bulkPut(payload.data.settings);
          if (payload.data.weightLogs?.length) await db.weightLogs.bulkPut(payload.data.weightLogs);
          if (payload.data.mealLogs?.length) await db.mealLogs.bulkPut(payload.data.mealLogs);
          if (payload.data.exercisePlans?.length) await db.exercisePlans.bulkPut(payload.data.exercisePlans);
          if (payload.data.exerciseOverrides?.length) await db.exerciseOverrides.bulkPut(payload.data.exerciseOverrides);
          if (payload.data.exerciseLogs?.length) await db.exerciseLogs.bulkPut(payload.data.exerciseLogs);
        });
        root.innerHTML = ''; await loadAllData(); render(); showToast('備份還原成功！');
      });
    }

    function buildCheckinBlob(dateStr, { size, theme, showWeight, showFood }) {
      const w = 1080, h = size === 'story' ? 1920 : 1080;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const dark = theme === 'dark';

      // 無印風格米色 / 暖深灰背景
      ctx.fillStyle = dark ? '#1C1917' : '#F7F4EF';
      ctx.fillRect(0, 0, w, h);

      // 卡片底色
      const pad = 64;
      ctx.fillStyle = dark ? '#292524' : '#FCFBF8';
      ctx.strokeStyle = dark ? '#44403C' : '#E5DFD3';
      ctx.lineWidth = 3;
      ctx.fillRect(pad, pad, w - pad * 2, h - pad * 2);
      ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);

      // 標題與日期
      ctx.fillStyle = dark ? '#E5A9A2' : '#8B3A34';
      ctx.font = 'bold 52px "PingFang TC", "Noto Sans TC", sans-serif';
      ctx.fillText('今日健康打卡', pad + 52, pad + 100);

      ctx.font = '600 30px "PingFang TC", "Noto Sans TC", sans-serif';
      ctx.fillStyle = dark ? '#A8A29E' : '#7A6F64';
      ctx.fillText(`${dateStr.replace(/-/g,'/')} (${getWeekdayLabel(dateStr)})`, pad + 52, pad + 158);

      const wLog = state.weightLogs.find(x => x.date === dateStr);
      const cal = computeDailyCalorieSummary(dateStr);
      ctx.fillStyle = dark ? '#E5A9A2' : '#8B3A34';
      ctx.font = 'bold 56px "PingFang TC", sans-serif';
      ctx.fillText(`今日體重：${showWeight ? (wLog ? wLog.weight.toFixed(1) + ' kg' : '未記錄') : '已隱藏'}`, pad + 52, pad + 275);

      const mLog = state.mealLogs.find(x => x.date === dateStr);
      ctx.fillStyle = dark ? '#F5F5F4' : '#383028';
      ctx.font = '600 32px "PingFang TC", sans-serif';
      let yy = pad + 375;
      [['早餐','breakfast'],['午餐','lunch'],['晚餐','dinner'],['其他','other']].forEach(([lbl, k]) => {
        const en = mLog?.[k];
        const txt = `${lbl}${showFood && en?.food ? ' — ' + en.food.slice(0,16) : ''}：${en?.calories !== null && en?.calories !== undefined ? en.calories + ' kcal' : '未記錄'}`;
        ctx.fillText(txt, pad + 52, yy); yy += 62;
      });
      ctx.fillText(`總攝取：${cal.totalIntake ?? '未記錄'} / 目標：${cal.targetCalories} kcal`, pad + 52, yy + 22);
      ctx.fillText(`運動總消耗：${cal.exerciseBurned} kcal`, pad + 52, yy + 84);

      const exList = getCombinedExercises(dateStr);
      yy += 160;
      ctx.fillStyle = dark ? '#A8A29E' : '#6E5B4B';
      ctx.font = 'bold 30px "PingFang TC", sans-serif';
      ctx.fillText('今日運動', pad + 52, yy);
      yy += 52;
      ctx.fillStyle = dark ? '#F5F5F4' : '#383028';
      ctx.font = '500 28px "PingFang TC", sans-serif';
      if (exList.length === 0) {
        ctx.fillText('休息日 / 未安排', pad + 52, yy);
      } else {
        exList.slice(0, 4).forEach(ex => {
          ctx.fillText(`${ex.completed ? '✓' : '○'} ${ex.name} ${ex.minutes} 分鐘`, pad + 52, yy);
          yy += 48;
        });
      }

      return new Promise(resolve => {
        const dataUrl = c.toDataURL('image/png');
        c.toBlob(blob => resolve({ blob, dataUrl }), 'image/png');
      });
    }

    async function openCheckinModal(dateStr) {
      const root = document.getElementById('modal-root');
      const currentTheme = state.settings.darkMode ? 'dark' : 'light';
      const { blob, dataUrl } = await buildCheckinBlob(dateStr, {
        size: 'square',
        theme: currentTheme,
        showWeight: true,
        showFood: true
      });
      state.checkin.blob = blob;
      state.checkin.dataUrl = dataUrl;

      root.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-end justify-center bg-stone-900/70 sm:items-center sm:p-4">
          <div class="max-h-[92dvh] w-full max-w-md overflow-y-auto rounded-t-3xl bg-muji-card p-5 shadow-xl dark:bg-stone-900 sm:rounded-3xl">
            <div class="mb-3 flex items-center justify-between">
              <h3 class="font-bold text-muji-red dark:text-red-300">今日打卡分享圖</h3>
              <button type="button" id="ck-close" class="rounded-full px-2 py-1 text-sm text-muji-muted">✕</button>
            </div>
            <div class="mb-3 flex justify-center rounded-2xl border border-muji-border bg-muji-soft p-2 dark:border-stone-700 dark:bg-stone-800">
              <img src="${dataUrl}" alt="今日健康打卡預覽圖" class="max-h-[55dvh] w-full rounded-xl object-contain shadow-sm" />
            </div>
            <p class="mb-3 text-center text-[11px] text-muji-muted">可直接點下方分享至 LINE / IG，或長按上方圖片儲存</p>
            <button type="button" id="ck-share" class="w-full rounded-xl bg-muji-red py-3 text-sm font-bold text-white">使用 iPhone 分享圖片</button>
          </div>
        </div>`;

      document.getElementById('ck-close').addEventListener('click', () => { root.innerHTML = ''; });
      document.getElementById('ck-share').addEventListener('click', async () => {
        const res = await shareOrDownload(state.checkin.blob, `health-checkin-${dateStr}.png`, '今日健康打卡');
        if (res === 'shared') showToast('已開啟分享選單');
        else if (res === 'downloaded') showToast('此瀏覽器不支援原生檔案分享，已改為儲存圖片（亦可長按預覽圖分享）');
      });
    }

    function render() {
      destroyCharts();
      renderBottomNav();
      const main = document.getElementById('app-content');
      if (state.tab === 'dashboard') renderDashboard(main);
      else if (state.tab === 'weight') renderWeightView(main);
      else if (state.tab === 'exercise') renderExerciseView(main);
      else if (state.tab === 'diet') renderDietView(main);
      else renderSettingsView(main);
    }

    (async () => {
      try {
        await db.open();
        await db.transaction('rw', db.settings, db.exercisePlans, async () => {
          if (!(await db.settings.get('main'))) await db.settings.put({ ...DEFAULT_SETTINGS });
          if ((await db.exercisePlans.count()) === 0) await db.exercisePlans.bulkPut(DEFAULT_PLANS);
        });
        await loadAllData();
        render();
      } catch (err) {
        document.getElementById('app-content').innerHTML = `<div class="rounded-2xl border border-red-200 bg-red-50 p-6 text-red-900"><strong>本機資料庫開啟失敗</strong><p class="mt-2 text-xs">${escHtml(err.message)}</p></div>`;
      }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
