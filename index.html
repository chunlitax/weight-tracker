<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="輕盈日誌" />
  <title>輕盈日誌 — 個人減重與運動管理</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"PingFang TC"', '"Noto Sans TC"', '"Microsoft JhengHei"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.10/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body { padding-bottom: 84px; -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  </style>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <header class="sticky top-0 z-30 border-b border-slate-200/70 bg-white/90 px-4 py-3 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/90">
    <div class="mx-auto flex max-w-3xl items-center justify-between">
      <h1 class="text-lg font-extrabold tracking-tight text-teal-700 dark:text-teal-400">輕盈日誌</h1>
      <span class="text-xs text-slate-400">IndexedDB 本機離線版</span>
    </div>
  </header>

  <main id="app-main" class="mx-auto max-w-3xl px-4 py-4">
    <div class="py-12 text-center text-sm text-slate-400">載入本機資料庫中…</div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-200 bg-white/95 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/95 safe-bottom">
    <div id="bottom-nav" class="mx-auto flex max-w-3xl items-center justify-around px-1 py-1.5"></div>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root" class="pointer-events-none fixed bottom-20 left-1/2 z-50 -translate-x-1/2"></div>

  <script>
    // ========= 1. 臺灣時間 (Asia/Taipei) 工具 =========
    const TAIPEI_TZ = 'Asia/Taipei';
    const WEEKDAY_NAMES = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const WEEKDAY_SHORT = ['日', '一', '二', '三', '四', '五', '六'];

    function formatTaipeiDate(date) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TAIPEI_TZ, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(date);
      const get = (t) => parts.find(p => p.type === t)?.value || '01';
      return `${get('year')}-${get('month')}-${get('day')}`;
    }
    function getTaipeiToday() { return formatTaipeiDate(new Date()); }
    function formatTaipeiFilenameTs() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TAIPEI_TZ, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(new Date());
      const get = (t) => parts.find(p => p.type === t)?.value || '00';
      return `${get('year')}-${get('month')}-${get('day')}-${get('hour')}${get('minute')}`;
    }
    function parseDateStr(s) { return new Date(`${s}T12:00:00+08:00`); }
    function isValidDateStr(s) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
      const [y, m, d] = s.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
    }
    function addDays(s, delta) {
      const dt = parseDateStr(s);
      dt.setUTCDate(dt.getUTCDate() + delta);
      return formatTaipeiDate(dt);
    }
    function diffDays(a, b) {
      return Math.round((parseDateStr(b).getTime() - parseDateStr(a).getTime()) / 86400000);
    }
    function getWeekday(s) {
      const name = new Intl.DateTimeFormat('en-US', { timeZone: TAIPEI_TZ, weekday: 'short' }).format(parseDateStr(s));
      return ({ Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 })[name] ?? 0;
    }
    function getWeekdayLabel(s) { return WEEKDAY_NAMES[getWeekday(s)]; }
    function getWeekDates(anchor) {
      const wd = getWeekday(anchor);
      const mon = addDays(anchor, wd === 0 ? -6 : 1 - wd);
      return Array.from({ length: 7 }, (_, i) => addDays(mon, i));
    }
    function getMonthDates(ym) {
      const [y, m] = ym.split('-').map(Number);
      const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
      return Array.from({ length: days }, (_, i) => `${ym}-${String(i + 1).padStart(2, '0')}`);
    }
    function round2(n) { return Math.round(n * 100) / 100; }
    function escHtml(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ========= 2. Dexie.js IndexedDB 資料庫 =========
    const db = new Dexie('LightLogWeightTrackerDB');
    db.version(1).stores({
      settings: 'id',
      weightLogs: 'id, &date',
      mealLogs: 'id, &date',
      exercisePlans: 'id, active',
      exerciseOverrides: 'id, &date',
      exerciseLogs: 'id, date, planId'
    });

    const DEFAULT_SETTINGS = {
      id: 'main',
      initialWeight: null,
      targetWeight: null,
      targetDate: null,
      dailyCalorieTarget: 1800,
      darkMode: false,
      lastBackupConfirmedAt: null,
      lastBackupGeneratedAt: null,
      backupReminderDays: 7,
      updatedAt: new Date().toISOString()
    };

    const DEFAULT_PLANS = [
      { id: 'plan_stepper', name: '健身房踏步機', category: 'cardio', met: 7.0, defaultMinutes: 30, scheduleType: 'daily', weekdays: [0,1,2,3,4,5,6], weeklyFrequency: 7, active: true, createdAt: '2026-01-01T00:00:00.000Z', updatedAt: '2026-01-01T00:00:00.000Z' },
      { id: 'plan_weights', name: '重量訓練', category: 'strength', met: 5.0, defaultMinutes: 60, scheduleType: 'weekly_days', weekdays: [2,5], weeklyFrequency: 2, active: true, createdAt: '2026-01-01T00:00:00.000Z', updatedAt: '2026-01-01T00:00:00.000Z' },
      { id: 'plan_badminton', name: '羽球', category: 'sport', met: 5.5, defaultMinutes: 60, scheduleType: 'weekly_days', weekdays: [3,6], weeklyFrequency: 2, active: true, createdAt: '2026-01-01T00:00:00.000Z', updatedAt: '2026-01-01T00:00:00.000Z' }
    ];

    // ========= 3. 應用程式狀態 =========
    const state = {
      tab: 'dashboard',
      selectedDate: getTaipeiToday(),
      weightRange: '30',
      showDailyLine: true,
      showMa7Line: true,
      showTargetLine: true,
      expandedExKey: null,
      settings: { ...DEFAULT_SETTINGS },
      weightLogs: [],
      mealLogs: [],
      exercisePlans: [],
      exerciseOverrides: [],
      exerciseLogs: [],
      persistStatus: { supported: false, persisted: false },
      charts: {}
    };

    function showToast(msg) {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = 'rounded-full bg-slate-900 px-4 py-2 text-xs font-medium text-white shadow-lg dark:bg-slate-100 dark:text-slate-900';
      el.textContent = msg;
      root.innerHTML = '';
      root.appendChild(el);
      setTimeout(() => { if (root.contains(el)) root.innerHTML = ''; }, 3000);
    }

    async function loadAllData() {
      const [s, w, m, p, o, e] = await Promise.all([
        db.settings.get('main'),
        db.weightLogs.toArray(),
        db.mealLogs.toArray(),
        db.exercisePlans.toArray(),
        db.exerciseOverrides.toArray(),
        db.exerciseLogs.toArray()
      ]);
      if (s) state.settings = s;
      state.weightLogs = w;
      state.mealLogs = m;
      state.exercisePlans = p;
      state.exerciseOverrides = o;
      state.exerciseLogs = e;
      document.documentElement.classList.toggle('dark', !!state.settings.darkMode);
    }

    // ========= 4. 計算引擎 =========
    function computeWeightStats() {
      const today = getTaipeiToday();
      const sorted = [...state.weightLogs].sort((a, b) => a.date.localeCompare(b.date));
      const latest = sorted[sorted.length - 1] || null;
      const prev = sorted[sorted.length - 2] || null;
      const latestWeight = latest ? latest.weight : null;
      const deltaFromPrevious = latest && prev ? round2(latest.weight - prev.weight) : null;
      const remainingToTarget = latestWeight !== null && state.settings.targetWeight !== null ? round2(latestWeight - state.settings.targetWeight) : null;
      const baseline = state.settings.initialWeight ?? (sorted[0]?.weight ?? null);
      const totalLostKg = latestWeight !== null && baseline !== null ? round2(baseline - latestWeight) : null;
      const totalLostPct = totalLostKg !== null && baseline > 0 ? round2((totalLostKg / baseline) * 100) : null;
      const daysRemaining = state.settings.targetDate ? diffDays(today, state.settings.targetDate) : null;

      const d7 = addDays(today, -6);
      const r7 = sorted.filter(l => l.date >= d7 && l.date <= today);
      const avg7Days = r7.length ? round2(r7.reduce((s, l) => s + l.weight, 0) / r7.length) : null;

      const d30 = addDays(today, -30);
      const r30 = sorted.filter(l => l.date >= d30 && l.date <= today);
      const change30Days = r30.length >= 2 ? round2(r30[r30.length - 1].weight - r30[0].weight) : null;

      let weeklyAvgChange = null;
      if (sorted.length >= 2) {
        const span = diffDays(sorted[0].date, sorted[sorted.length - 1].date);
        if (span >= 1) weeklyAvgChange = round2(((sorted[sorted.length - 1].weight - sorted[0].weight) / span) * 7);
      }
      return { latestWeight, deltaFromPrevious, remainingToTarget, totalLostKg, totalLostPct, daysRemaining, avg7Days, change30Days, weeklyAvgChange, sorted };
    }

    function getScheduledPlansForDate(dateStr) {
      const ov = state.exerciseOverrides.find(o => o.date === dateStr);
      if (ov?.isRestDay) return [];
      const active = state.exercisePlans.filter(p => p.active);
      if (ov && Array.isArray(ov.customPlanIds)) {
        const set = new Set(ov.customPlanIds);
        return active.filter(p => set.has(p.id));
      }
      const wd = getWeekday(dateStr);
      return active.filter(p => p.scheduleType === 'daily' || (p.scheduleType === 'weekly_days' && p.weekdays.includes(wd)));
    }

    function getCombinedExercises(dateStr) {
      const scheduled = getScheduledPlansForDate(dateStr);
      const dayLogs = state.exerciseLogs.filter(l => l.date === dateStr);
      const list = scheduled.map(plan => {
        const log = dayLogs.find(l => l.planId === plan.id);
        return {
          key: plan.id, plan, log,
          name: log?.name ?? plan.name,
          minutes: log?.actualMinutes ?? log?.plannedMinutes ?? plan.defaultMinutes,
          completed: log?.completed ?? false,
          calories: log?.caloriesBurned ?? null,
          isEstimated: log?.caloriesIsEstimated ?? false
        };
      });
      dayLogs.filter(l => l.isAdHoc || !scheduled.some(p => p.id === l.planId)).forEach(log => {
        list.push({
          key: log.id, plan: null, log, name: log.name,
          minutes: log.actualMinutes ?? log.plannedMinutes,
          completed: log.completed, calories: log.caloriesBurned, isEstimated: log.caloriesIsEstimated
        });
      });
      return list;
    }

    function computeDailyCalorieSummary(dateStr) {
      const mealLog = state.mealLogs.find(m => m.date === dateStr);
      const exLogs = state.exerciseLogs.filter(l => l.date === dateStr && l.completed);
      const target = mealLog?.targetCaloriesSnapshot ?? state.settings.dailyCalorieTarget;
      const exerciseBurned = exLogs.reduce((s, l) => s + (l.caloriesBurned ?? 0), 0);
      if (!mealLog) return { totalIntake: null, targetCalories: target, remainingQuota: null, exerciseBurned, netAfterExercise: null };
      const vals = [mealLog.breakfast.calories, mealLog.lunch.calories, mealLog.dinner.calories, mealLog.other.calories]
        .filter(v => v !== null && !Number.isNaN(v));
      if (!vals.length) return { totalIntake: null, targetCalories: target, remainingQuota: null, exerciseBurned, netAfterExercise: null };
      const totalIntake = vals.reduce((a, b) => a + b, 0);
      return { totalIntake, targetCalories: target, remainingQuota: target - totalIntake, exerciseBurned, netAfterExercise: totalIntake - exerciseBurned };
    }

    function estimateMetCalories(met, weightKg, mins) {
      const w = weightKg && weightKg > 0 ? weightKg : 65;
      return Math.round(met * w * (mins / 60));
    }

    // ========= 5. 資料庫寫入操作 =========
    async function saveWeight(date, weight, note = '') {
      try {
        const now = new Date().toISOString();
        const existing = await db.weightLogs.get(`w_${date}`);
        await db.transaction('rw', db.weightLogs, async () => {
          await db.weightLogs.put({ id: `w_${date}`, date, weight, note, createdAt: existing?.createdAt ?? now, updatedAt: now });
        });
        await loadAllData();
        render();
        showToast('體重已儲存');
      } catch (err) {
        showToast('寫入失敗：' + (err.message || '儲存空間不足'));
      }
    }

    async function saveMealField(date, mealKey, field, rawVal) {
      try {
        const existing = await db.mealLogs.get(`m_${date}`);
        const base = existing || {
          id: `m_${date}`, date, targetCaloriesSnapshot: state.settings.dailyCalorieTarget,
          breakfast: { food: '', calories: null }, lunch: { food: '', calories: null },
          dinner: { food: '', calories: null }, other: { food: '', calories: null }, updatedAt: new Date().toISOString()
        };
        const nextEntry = { ...base[mealKey] };
        if (field === 'food') nextEntry.food = rawVal;
        else nextEntry.calories = rawVal.trim() === '' ? null : Math.max(0, Math.round(Number(rawVal)));
        base[mealKey] = nextEntry;
        base.updatedAt = new Date().toISOString();
        await db.transaction('rw', db.mealLogs, async () => { await db.mealLogs.put(base); });
        await loadAllData();
        render();
        showToast('飲食紀錄已儲存');
      } catch (err) {
        showToast('寫入失敗：' + err.message);
      }
    }

    async function toggleExerciseItem(date, key, updates) {
      try {
        const items = getCombinedExercises(date);
        const target = items.find(i => i.key === key);
        if (!target) return;
        const now = new Date().toISOString();
        const id = target.log?.id ?? `ex_${date}_${target.plan.id}`;
        const record = {
          id, date,
          planId: target.log?.planId ?? target.plan?.id ?? null,
          name: target.log?.name ?? target.plan?.name ?? '運動',
          met: target.log?.met ?? target.plan?.met ?? 5.0,
          plannedMinutes: target.log?.plannedMinutes ?? target.plan?.defaultMinutes ?? 30,
          actualMinutes: target.log?.actualMinutes ?? target.plan?.defaultMinutes ?? 30,
          completed: target.log?.completed ?? false,
          caloriesBurned: target.log?.caloriesBurned ?? null,
          caloriesIsEstimated: target.log?.caloriesIsEstimated ?? false,
          note: target.log?.note ?? '',
          isAdHoc: target.log?.isAdHoc ?? !target.plan,
          createdAt: target.log?.createdAt ?? now,
          updatedAt: now,
          ...updates
        };
        await db.transaction('rw', db.exerciseLogs, async () => { await db.exerciseLogs.put(record); });
        await loadAllData();
        render();
        showToast('運動紀錄已儲存');
      } catch (err) {
        showToast('寫入失敗：' + err.message);
      }
    }

    // ========= 6. 頁面渲染 =========
    function destroyCharts() {
      Object.values(state.charts).forEach(c => c?.destroy());
      state.charts = {};
    }

    function renderBottomNav() {
      const items = [
        { id: 'dashboard', label: '今日', icon: '🏠' },
        { id: 'weight', label: '體重', icon: '📈' },
        { id: 'exercise', label: '運動', icon: '🏃' },
        { id: 'diet', label: '飲食', icon: '🍽️' },
        { id: 'settings', label: '設定', icon: '⚙️' }
      ];
      document.getElementById('bottom-nav').innerHTML = items.map(it => `
        <button type="button" data-nav="${it.id}" class="flex min-w-[60px] flex-col items-center rounded-xl px-2 py-1.5 text-xs font-medium ${state.tab === it.id ? 'text-teal-600 dark:text-teal-400 font-bold' : 'text-slate-500 dark:text-slate-400'}">
          <span class="text-base leading-none mb-1">${it.icon}</span>
          <span>${it.label}</span>
        </button>
      `).join('');
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => { state.tab = btn.dataset.nav; render(); });
      });
    }

    function renderDashboard(main) {
      const today = getTaipeiToday();
      const d = state.selectedDate;
      const wStats = computeWeightStats();
      const wLog = state.weightLogs.find(w => w.date === d);
      const mLog = state.mealLogs.find(m => m.date === d);
      const exItems = getCombinedExercises(d);
      const cal = computeDailyCalorieSummary(d);
      const isOver = cal.remainingQuota !== null && cal.remainingQuota < 0;
      const ratio = cal.totalIntake !== null && cal.targetCalories > 0 ? Math.min(100, Math.round((cal.totalIntake / cal.targetCalories) * 100)) : 0;

      const daysSinceBackup = state.settings.lastBackupConfirmedAt
        ? diffDays(state.settings.lastBackupConfirmedAt.slice(0, 10), today) : null;
      const needReminder = daysSinceBackup === null
        ? (state.weightLogs.length + state.mealLogs.length + state.exerciseLogs.length >= 3)
        : daysSinceBackup >= state.settings.backupReminderDays;

      main.innerHTML = `
        <div class="space-y-4">
          ${needReminder ? `
            <div class="flex items-center justify-between gap-3 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-xs text-amber-900 dark:border-amber-800 dark:bg-amber-950/50 dark:text-amber-200">
              <span>${daysSinceBackup === null ? '建議定期匯出 JSON 備份，確保本機資料安全。' : `距離上次確認備份已過 ${daysSinceBackup} 天，建議匯出備份。`}</span>
              <button type="button" id="btn-go-backup" class="shrink-0 rounded-xl bg-amber-600 px-3 py-1.5 font-semibold text-white">前往備份</button>
            </div>` : ''}

          <section class="rounded-3xl border border-slate-200/80 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <div class="mb-3 flex items-center justify-between">
              <div>
                <p class="text-xs font-medium text-teal-600 dark:text-teal-400">${d === today ? '今天' : '歷史檢視 / 補登'}</p>
                <h2 class="text-lg font-bold">${d.replace(/-/g, '/')} ${getWeekdayLabel(d)}</h2>
              </div>
              <input type="date" id="dash-date" value="${d}" max="${today}" class="rounded-xl border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-xs dark:border-slate-700 dark:bg-slate-800" />
            </div>
            <div class="flex items-end justify-between gap-4">
              <div>
                <span class="text-xs text-slate-500">空腹體重</span>
                <div class="mt-0.5 flex items-baseline gap-2">
                  <span class="text-3xl font-extrabold">${wLog ? wLog.weight.toFixed(2) : '--'}</span>
                  <span class="text-sm text-slate-500">kg</span>
                </div>
                <div class="mt-1.5 flex flex-wrap gap-3 text-xs text-slate-500">
                  <span>較上筆：${wStats.deltaFromPrevious !== null ? (wStats.deltaFromPrevious > 0 ? '+' : '') + wStats.deltaFromPrevious.toFixed(2) + ' kg' : '尚無對比'}</span>
                  <span>距目標：${wStats.remainingToTarget !== null ? (wStats.remainingToTarget > 0 ? '還差 ' : '已超越 ') + Math.abs(wStats.remainingToTarget).toFixed(2) + ' kg' : '未設定'}</span>
                </div>
              </div>
              <button type="button" id="btn-toggle-w" class="rounded-2xl bg-teal-600 px-4 py-2.5 text-sm font-semibold text-white">${wLog ? '修改體重' : '快速輸入'}</button>
            </div>
            <form id="dash-w-form" class="mt-4 hidden gap-2">
              <input type="number" id="dash-w-input" inputmode="decimal" step="0.01" placeholder="例如 68.45" value="${wLog ? wLog.weight : ''}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-base dark:border-slate-700 dark:bg-slate-800" />
              <button type="submit" class="shrink-0 rounded-xl bg-teal-600 px-4 py-2 text-sm font-semibold text-white">儲存</button>
            </form>
          </section>

          <section class="rounded-3xl border border-slate-200/80 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <div class="mb-3 flex items-center justify-between">
              <h3 class="font-bold">今日熱量管理</h3>
              <span class="text-xs text-slate-500">目標 ${cal.targetCalories} kcal</span>
            </div>
            <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
              <div class="rounded-2xl bg-slate-50 p-3 dark:bg-slate-800/70"><div class="text-xs text-slate-500">今日攝取</div><div class="mt-1 text-xl font-bold">${cal.totalIntake !== null ? cal.totalIntake : '未記錄'}</div></div>
              <div class="rounded-2xl p-3 ${isOver ? 'bg-amber-50 dark:bg-amber-950/40' : 'bg-teal-50/70 dark:bg-teal-950/40'}"><div class="text-xs text-slate-500">剩餘攝取額度</div><div class="mt-1 text-xl font-bold ${isOver ? 'text-amber-700 dark:text-amber-300' : 'text-teal-700 dark:text-teal-300'}">${cal.remainingQuota !== null ? cal.remainingQuota : '未記錄'}</div></div>
              <div class="rounded-2xl bg-slate-50 p-3 dark:bg-slate-800/70"><div class="text-xs text-slate-500">運動消耗</div><div class="mt-1 text-xl font-bold">${cal.exerciseBurned}</div></div>
              <div class="rounded-2xl bg-slate-50 p-3 dark:bg-slate-800/70"><div class="text-xs text-slate-500">攝取−運動差額</div><div class="mt-1 text-xl font-bold">${cal.netAfterExercise !== null ? cal.netAfterExercise : '未記錄'}</div></div>
            </div>
            <div class="mt-3">

          </section>
          <section class="grid grid-cols-2 gap-3">
            <div class="rounded-2xl border border-slate-200/80 bg-white p-3.5 dark:border-slate-800 dark:bg-slate-900"><div class="text-xs text-slate-500">當日總攝取</div><div class="mt-1 text-lg font-bold">${cal.totalIntake !== null ? cal.totalIntake + ' kcal' : '未記錄'}</div></div>
            <div class="rounded-2xl border border-slate-200/80 bg-white p-3.5 dark:border-slate-800 dark:bg-slate-900"><div class="text-xs text-slate-500">剩餘額度</div><div class="mt-1 text-lg font-bold text-teal-600">${cal.remainingQuota !== null ? cal.remainingQuota + ' kcal' : '未記錄'}</div></div>
          </section>
          ${[['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['other','其他飲食（選填）']].map(([k, lbl]) => {
            const entry = mLog?.[k];
            return `
              <div class="rounded-3xl border border-slate-200/80 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
                <div class="mb-2 flex justify-between"><span class="font-bold">${lbl}</span><span class="text-xs text-slate-500">${entry?.calories !== null && entry?.calories !== undefined ? entry.calories + ' kcal' : '未記錄'}</span></div>
                <textarea rows="2" data-dfood="${k}" placeholder="自由輸入吃了什麼" class="mb-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">${escHtml(entry?.food ?? '')}</textarea>
                <div class="flex items-center justify-end gap-2 text-xs"><span>熱量 (kcal)：</span><input type="number" inputmode="numeric" data-dcal="${k}" value="${entry?.calories ?? ''}" placeholder="未記錄" class="w-28 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-right text-sm dark:border-slate-700 dark:bg-slate-800" /></div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      document.getElementById('diet-date').addEventListener('change', (e) => { if (e.target.value) { state.selectedDate = e.target.value; render(); } });
      document.querySelectorAll('[data-dfood]').forEach(el => el.addEventListener('change', (e) => saveMealField(d, el.dataset.dfood, 'food', e.target.value)));
      document.querySelectorAll('[data-dcal]').forEach(el => el.addEventListener('change', (e) => saveMealField(d, el.dataset.dcal, 'calories', e.target.value)));
    }

    function renderSettingsView(main) {
      const today = getTaipeiToday();
      const s = state.settings;
      main.innerHTML = `
        <div class="space-y-4">
          <section class="rounded-3xl border border-slate-200/80 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <div class="mb-4 flex items-center justify-between">
              <h3 class="font-bold">個人目標與外觀</h3>
              <button type="button" id="btn-dark" class="rounded-xl bg-slate-100 px-3 py-1.5 text-xs font-semibold dark:bg-slate-800">${s.darkMode ? '☀️ 淺色模式' : '🌙 深色模式'}</button>
            </div>
            <form id="set-goal-form" class="space-y-3 text-xs">
              <div class="grid grid-cols-2 gap-3">
                <label>初始體重 (kg)<input type="number" step="0.01" id="set-initw" value="${s.initialWeight ?? ''}" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800" /></label>
                <label>目標體重 (kg)<input type="number" step="0.01" id="set-targw" value="${s.targetWeight ?? ''}" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800" /></label>
                <label>目標日期<input type="date" id="set-targd" value="${s.targetDate ?? ''}" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800" /></label>
                <label>每日熱量目標 (kcal)<input type="number" id="set-cal" value="${s.dailyCalorieTarget}" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800" /></label>
              </div>
              <button type="submit" class="w-full rounded-2xl bg-teal-600 py-2.5 text-sm font-semibold text-white">儲存目標設定</button>
            </form>
          </section>

          <section class="rounded-3xl border border-slate-200/80 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <h3 class="mb-2 font-bold">資料備份與還原 (JSON)</h3>
            <p class="mb-3 rounded-2xl bg-slate-50 p-3 text-xs text-slate-600 dark:bg-slate-800/70 dark:text-slate-300">
              上次確認備份：<strong>${s.lastBackupConfirmedAt ? s.lastBackupConfirmedAt.slice(0,10) : '尚未確認'}</strong>
            </p>
            <div class="space-y-2.5">
              <button type="button" id="btn-backup-json" class="w-full rounded-2xl bg-teal-600 py-3 text-sm font-bold text-white">立即備份 (匯出完整 JSON)</button>
              ${s.lastBackupGeneratedAt ? `<button type="button" id="btn-confirm-backup" class="w-full rounded-2xl border border-teal-600 bg-teal-50 py-2.5 text-xs font-bold text-teal-700 dark:bg-teal-950/50 dark:text-teal-300">✓ 我已確認將備份檔存入檔案 / iCloud Drive</button>` : ''}
              <input type="file" id="inp-restore-json" accept=".json,application/json" class="hidden" />
              <button type="button" id="btn-restore-json" class="w-full rounded-2xl border border-slate-200 py-3 text-sm font-semibold dark:border-slate-700">匯入 JSON 備份還原</button>
            </div>
          </section>

          <section class="rounded-3xl border border-slate-200/80 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <h3 class="mb-1 font-bold">匯出 CSV（Excel 分析用，UTF-8 BOM）</h3>
            <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
              <button type="button" id="btn-csv-daily" class="rounded-2xl border border-slate-200 py-2.5 text-xs font-semibold dark:border-slate-700">每日體重與熱量統計 CSV</button>
              <button type="button" id="btn-csv-ex" class="rounded-2xl border border-slate-200 py-2.5 text-xs font-semibold dark:border-slate-700">運動明細 CSV</button>
            </div>
          </section>
        </div>
      `;

      document.getElementById('btn-dark').addEventListener('click', async () => {
        await db.settings.put({ ...state.settings, darkMode: !state.settings.darkMode, updatedAt: new Date().toISOString() });
        await loadAllData(); render();
      });
      document.getElementById('set-goal-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const next = {
          ...state.settings,
          initialWeight: document.getElementById('set-initw').value.trim() ? Number(document.getElementById('set-initw').value) : null,
          targetWeight: document.getElementById('set-targw').value.trim() ? Number(document.getElementById('set-targw').value) : null,
          targetDate: document.getElementById('set-targd').value.trim() || null,
          dailyCalorieTarget: Math.max(800, Math.round(Number(document.getElementById('set-cal').value) || 1800)),
          updatedAt: new Date().toISOString()
        };
        await db.settings.put(next); await loadAllData(); render(); showToast('設定已儲存');
      });
      document.getElementById('btn-backup-json').addEventListener('click', async () => {
        const payload = {
          app: 'light-log-weight-tracker', schemaVersion: 1, backupVersion: '1.0.0', exportedAt: new Date().toISOString(),
          data: { settings: await db.settings.toArray(), weightLogs: await db.weightLogs.toArray(), mealLogs: await db.mealLogs.toArray(), exercisePlans: await db.exercisePlans.toArray(), exerciseOverrides: await db.exerciseOverrides.toArray(), exerciseLogs: await db.exerciseLogs.toArray() }
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        downloadBlob(blob, `weight-backup-${formatTaipeiFilenameTs()}.json`);
        await db.settings.put({ ...state.settings, lastBackupGeneratedAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
        await loadAllData(); render(); showToast('已產生備份檔，請確認儲存後點擊確認按鈕');
      });
      document.getElementById('btn-confirm-backup')?.addEventListener('click', async () => {
        await db.settings.put({ ...state.settings, lastBackupConfirmedAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
        await loadAllData(); render(); showToast('已更新上次確認備份日期');
      });
      document.getElementById('btn-restore-json').addEventListener('click', () => document.getElementById('inp-restore-json').click());
      document.getElementById('inp-restore-json').addEventListener('change', async (e) => {
        const file = e.target.files?.[0]; e.target.value = '';
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          if (parsed?.app !== 'light-log-weight-tracker' || parsed?.schemaVersion !== 1 || !parsed?.data) {
            return showToast('備份格式或版本不相容，已取消匯入');
          }
          openRestoreConfirmModal(parsed);
        } catch { showToast('JSON 解析失敗，原有資料安全保留'); }
      });
      document.getElementById('btn-csv-daily').addEventListener('click', () => {
        const dates = Array.from(new Set([...state.weightLogs.map(w=>w.date), ...state.mealLogs.map(m=>m.date), ...state.exerciseLogs.map(e=>e.date)])).sort();
        const header = '日期,體重(kg),早餐熱量(kcal),午餐熱量(kcal),晚餐熱量(kcal),其他熱量(kcal),當日總攝取(kcal),當日攝取目標(kcal),運動項目,運動時間(分鐘),運動消耗熱量(kcal)';
        const rows = dates.map(dt => {
          const w = state.weightLogs.find(x=>x.date===dt);
          const m = state.mealLogs.find(x=>x.date===dt);
          const ex = state.exerciseLogs.filter(x=>x.date===dt && x.completed);
          const cal = computeDailyCalorieSummary(dt);
          return [dt, w ? w.weight.toFixed(2) : '', m?.breakfast.calories ?? '未記錄', m?.lunch.calories ?? '未記錄', m?.dinner.calories ?? '未記錄', m?.other.calories ?? '未記錄', cal.totalIntake ?? '未記錄', cal.targetCalories, ex.map(x=>x.name).join(' / '), ex.length ? ex.reduce((s,x)=>s+(x.actualMinutes??x.plannedMinutes),0) : '', ex.length ? ex.reduce((s,x)=>s+(x.caloriesBurned??0),0) : ''].join(',');
        });
        downloadBlob(new Blob(['\uFEFF' + [header, ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' }), `daily-summary-${today}.csv`);
        showToast('已匯出每日統計 CSV');
      });
      document.getElementById('btn-csv-ex').addEventListener('click', () => {
        const header = '日期,運動項目,是否完成,預定時間(分鐘),實際時間(分鐘),消耗熱量(kcal)';
        const rows = state.exerciseLogs.map(e => [e.date, e.name, e.completed ? '已完成' : '未完成', e.plannedMinutes, e.actualMinutes ?? '', e.caloriesBurned ?? ''].join(','));
        downloadBlob(new Blob(['\uFEFF' + [header, ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' }), `exercise-details-${today}.csv`);
        showToast('已匯出運動明細 CSV');
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function openRestoreConfirmModal(payload) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
          <div class="w-full max-w-sm rounded-3xl bg-white p-5 shadow-xl dark:bg-slate-900">
            <h4 class="font-bold text-amber-600">確認覆蓋還原資料？</h4>
            <p class="mt-2 text-xs text-slate-500">備份包含體重 ${payload.data.weightLogs?.length || 0} 筆、飲食 ${payload.data.mealLogs?.length || 0} 筆、運動 ${payload.data.exerciseLogs?.length || 0} 筆。覆蓋後無法復原！</p>
            <div class="mt-4 flex justify-end gap-2">
              <button type="button" id="m-cancel" class="rounded-xl px-4 py-2 text-xs">取消</button>
              <button type="button" id="m-confirm" class="rounded-xl bg-rose-600 px-4 py-2 text-xs font-bold text-white">確認覆蓋還原</button>
            </div>
          </div>
        </div>`;
      document.getElementById('m-cancel').addEventListener('click', () => { root.innerHTML = ''; });
      document.getElementById('m-confirm').addEventListener('click', async () => {
        await db.transaction('rw', [db.settings, db.weightLogs, db.mealLogs, db.exercisePlans, db.exerciseOverrides, db.exerciseLogs], async () => {
          await Promise.all([db.settings.clear(), db.weightLogs.clear(), db.mealLogs.clear(), db.exercisePlans.clear(), db.exerciseOverrides.clear(), db.exerciseLogs.clear()]);
          if (payload.data.settings?.length) await db.settings.bulkPut(payload.data.settings);
          if (payload.data.weightLogs?.length) await db.weightLogs.bulkPut(payload.data.weightLogs);
          if (payload.data.mealLogs?.length) await db.mealLogs.bulkPut(payload.data.mealLogs);
          if (payload.data.exercisePlans?.length) await db.exercisePlans.bulkPut(payload.data.exercisePlans);
          if (payload.data.exerciseOverrides?.length) await db.exerciseOverrides.bulkPut(payload.data.exerciseOverrides);
          if (payload.data.exerciseLogs?.length) await db.exerciseLogs.bulkPut(payload.data.exerciseLogs);
        });
        root.innerHTML = ''; await loadAllData(); render(); showToast('備份還原成功！');
      });
    }

    function openCheckinModal(dateStr) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/60 sm:items-center sm:p-4">
          <div class="w-full max-w-md rounded-t-3xl bg-white p-5 shadow-xl dark:bg-slate-900 sm:rounded-3xl">
            <div class="mb-4 flex items-center justify-between"><h3 class="font-bold">產生今日打卡圖片 (PNG)</h3><button type="button" id="ck-close" class="text-sm text-slate-500">✕</button></div>
            <div class="space-y-3 text-sm">
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2 rounded-xl border p-2.5"><input type="radio" name="ck-size" value="story" checked />直式 1080×1920</label>
                <label class="flex items-center gap-2 rounded-xl border p-2.5"><input type="radio" name="ck-size" value="square" />正方形 1080×1080</label>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2 rounded-xl border p-2.5"><input type="radio" name="ck-theme" value="light" checked />清爽淺色</label>
                <label class="flex items-center gap-2 rounded-xl border p-2.5"><input type="radio" name="ck-theme" value="dark" />質感深色</label>
              </div>
              <label class="flex items-center justify-between rounded-xl bg-slate-50 p-3 dark:bg-slate-800"><span>顯示體重數字</span><input type="checkbox" id="ck-w" checked class="h-4 w-4" /></label>
              <label class="flex items-center justify-between rounded-xl bg-slate-50 p-3 dark:bg-slate-800"><span>顯示飲食文字</span><input type="checkbox" id="ck-f" checked class="h-4 w-4" /></label>
              <button type="button" id="ck-dl" class="w-full rounded-2xl bg-teal-600 py-3 font-bold text-white">下載打卡 PNG 圖片</button>
            </div>
          </div>
        </div>`;
      document.getElementById('ck-close').addEventListener('click', () => { root.innerHTML = ''; });
      document.getElementById('ck-dl').addEventListener('click', async () => {
        const size = document.querySelector('input[name="ck-size"]:checked').value;
        const theme = document.querySelector('input[name="ck-theme"]:checked').value;
        const showW = document.getElementById('ck-w').checked;
        const showF = document.getElementById('ck-f').checked;
        const w = 1080, h = size === 'story' ? 1920 : 1080;
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        const dark = theme === 'dark';
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, dark ? '#0f172a' : '#f0fdfa');
        grad.addColorStop(1, dark ? '#115e59' : '#e6fffa');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = dark ? '#f8fafc' : '#0f172a';
        ctx.font = 'bold 52px "PingFang TC", "Noto Sans TC", sans-serif';
        ctx.fillText('今日健康打卡', 64, 120);
        ctx.font = '600 30px "PingFang TC", "Noto Sans TC", sans-serif';
        ctx.fillStyle = dark ? '#94a3b8' : '#64748b';
        ctx.fillText(`${dateStr.replace(/-/g,'/')} (${getWeekdayLabel(dateStr)})`, 64, 175);

        const wLog = state.weightLogs.find(x => x.date === dateStr);
        const cal = computeDailyCalorieSummary(dateStr);
        ctx.fillStyle = dark ? '#2dd4bf' : '#0d9488';
        ctx.font = 'bold 56px "PingFang TC", sans-serif';
        ctx.fillText(`今日體重：${showW ? (wLog ? wLog.weight.toFixed(1) + ' kg' : '未記錄') : '已隱藏'}`, 64, 300);

        const mLog = state.mealLogs.find(x => x.date === dateStr);
        ctx.fillStyle = dark ? '#f8fafc' : '#0f172a';
        ctx.font = '600 32px "PingFang TC", sans-serif';
        let yy = 400;
        [['早餐','breakfast'],['午餐','lunch'],['晚餐','dinner'],['其他','other']].forEach(([lbl, k]) => {
          const en = mLog?.[k];
          const txt = `${lbl}${showF && en?.food ? ' — ' + en.food.slice(0,16) : ''}：${en?.calories !== null && en?.calories !== undefined ? en.calories + ' kcal' : '未記錄'}`;
          ctx.fillText(txt, 64, yy); yy += 64;
        });
        ctx.fillText(`總攝取：${cal.totalIntake ?? '未記錄'} / 目標：${cal.targetCalories} kcal`, 64, yy + 20);
        ctx.fillText(`運動總消耗：${cal.exerciseBurned} kcal`, 64, yy + 84);
        c.toBlob(blob => { downloadBlob(blob, `health-checkin-${dateStr}-${size}.png`); showToast('已下載打卡 PNG 圖片'); }, 'image/png');
      });
    }

    function render() {
      destroyCharts();
      renderBottomNav();
      const main = document.getElementById('app-main');
      if (state.tab === 'dashboard') renderDashboard(main);
      else if (state.tab === 'weight') renderWeightView(main);
      else if (state.tab === 'exercise') renderExerciseView(main);
      else if (state.tab === 'diet') renderDietView(main);
      else renderSettingsView(main);
    }

    (async () => {
      try {
        await db.open();
        await db.transaction('rw', db.settings, db.exercisePlans, async () => {
          if (!(await db.settings.get('main'))) await db.settings.put({ ...DEFAULT_SETTINGS });
          if ((await db.exercisePlans.count()) === 0) await db.exercisePlans.bulkPut(DEFAULT_PLANS);
        });
        await loadAllData();
        render();
      } catch (err) {
        document.getElementById('app-main').innerHTML = `<div class="rounded-3xl border border-rose-200 bg-rose-50 p-6 text-rose-900"><strong>本機資料庫開啟失敗</strong><p class="mt-2 text-xs">${escHtml(err.message)}</p></div>`;
      }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
